<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 895 136" width="895" height="136" role="img" aria-label="Footer for Rehan Nasywa Ramadhan">
  <title>Footer for Rehan Nasywa Ramadhan</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#11161d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e252e"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a525d"/>
      <stop offset="45%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#232931"/>
    </linearGradient>
    <radialGradient id="led-red" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#ff9c93"/>
      <stop offset="100%" stop-color="#ec544a"/>
    </radialGradient>
    <radialGradient id="led-amber" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#e0a223"/>
    </radialGradient>
    <radialGradient id="led-green" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#7cf08e"/>
      <stop offset="100%" stop-color="#1fa832"/>
    </radialGradient>
    <radialGradient id="halo-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.05" fill="#2c333b" opacity="0.5"/>
    </pattern>
    <filter id="eye-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .cmd   { font-size: 14px; font-weight: 600; }
      .body  { font-size: 12px; }
      .hero  { font-size: 20px; font-weight: 700; }
      .micro { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; }
      .dim  { fill: #8b949e; }
      .ok   { fill: #3fb950; }
      .blue { fill: #58a6ff; }

      .cursor  { fill: #3fb950; animation: blink 1.05s steps(1, end) infinite; }
      .name    { animation: breathe 5s ease-in-out infinite; }
      .led     { animation: breathe 3.4s ease-in-out infinite; }
      .eye     { animation: eye-blink 5.6s steps(1, end) infinite; }
      .reveal  { animation: reveal .95s steps(20, end) .35s both; }

      @keyframes blink    { 0%,45% { opacity: 1; } 46%,100% { opacity: 0; } }
      @keyframes breathe  { 0%,100% { opacity: .34; } 50% { opacity: .78; } }
      @keyframes eye-blink { 0%, 90%, 100% { opacity: 1; }
                             93%, 96% { opacity: 0; } }
      @keyframes reveal   { from { width: 0; } to { width: 210px; } }

      @media (prefers-reduced-motion: reduce) {
        .cursor, .name, .led, .eye, .reveal { animation: none !important; }
      }
    </style>
    <clipPath id="reveal">
      <rect class="reveal" x="96" y="60" width="210" height="22"/>
    </clipPath>
  </defs>

  <!-- backdrop -->
  <rect x="1" y="1" width="893" height="134" rx="14" fill="url(#bg)"/>
  <rect x="1" y="41" width="893" height="94" fill="url(#dots)"/>
  <ellipse cx="215" cy="88" rx="310" ry="72" fill="url(#halo-green)"/>
  <ellipse cx="700" cy="88" rx="340" ry="76" fill="url(#halo-blue)"/>

  <!-- window chrome -->
  <path d="M1 15 C1 7.3 7.3 1 15 1 L880 1 C887.7 1 894 7.3 894 15 L894 41 L1 41 Z" fill="url(#chrome)"/>
  <line x1="1" y1="41.5" x2="894" y2="41.5" stroke="#30363d"/>
  <circle cx="26" cy="21" r="6.3" fill="url(#led-red)"/>
  <circle cx="46" cy="21" r="6.3" fill="url(#led-amber)"/>
  <circle cx="66" cy="21" r="6.3" fill="url(#led-green)"/>
  <text x="447.5" y="25.5" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">hannwya@workspace:~/exit</text>
  <circle cx="806" cy="21" r="3" fill="#3fb950" class="led"/>
  <text x="818" y="25" class="mono micro" fill="#6e7681">SESSION</text>

  <!-- prompt -->
  <text x="56" y="74" class="mono cmd blue">&#10148; ~</text>
  <g clip-path="url(#reveal)">
    <text x="96" y="74" class="mono cmd" fill="#f0f6fc">echo $STATUS &amp;&amp; exit<tspan class="cursor">&#9612;</tspan></text>
  </g>

  <!-- one-line closer -->
  <text x="56" y="106" class="mono body"><tspan class="dim">[process completed &#183; code </tspan><tspan class="ok">0</tspan><tspan class="dim">]</tspan><tspan class="dim"> &#183; </tspan><tspan class="ok">thanks for visiting!</tspan></text>

