<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 895 280" width="895" height="280" role="img" aria-label="Thanks for visiting - footer for Rehan Nasywa Ramadhan">
  <title>Thanks for visiting - footer for Rehan Nasywa Ramadhan</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#11161d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e252e"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a525d"/>
      <stop offset="45%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#232931"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.9"/>
      <stop offset="34%" stop-color="#30363d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="name-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee89a"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6f33"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <radialGradient id="halo-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="halo-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="led-red" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#ff9c93"/>
      <stop offset="100%" stop-color="#ec544a"/>
    </radialGradient>
    <radialGradient id="led-amber" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#e0a223"/>
    </radialGradient>
    <radialGradient id="led-green" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#7cf08e"/>
      <stop offset="100%" stop-color="#1fa832"/>
    </radialGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.05" fill="#2c333b" opacity="0.5"/>
    </pattern>

    <filter id="soft-glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>

    <filter id="cell-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .cmd   { font-size: 14px; font-weight: 600; }
      .body  { font-size: 13px; }
      .micro { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; }
      .hero  { font-size: 26px; font-weight: 700; }
      .dim  { fill: #8b949e; }
      .key  { fill: #8b949e; }
      .val  { fill: #c9d1d9; }
      .ok   { fill: #3fb950; }
      .blue { fill: #58a6ff; }

      .cursor  { fill: #3fb950; animation: blink 1.05s steps(1, end) infinite; }
      .name    { animation: breathe 5s ease-in-out infinite; }
      .led     { animation: breathe 3.4s ease-in-out infinite; }
      .led-dot { transform-box: fill-box; transform-origin: center;
                 animation: ping 2.4s ease-in-out infinite; }
      .sheen   { animation: sheen 10s ease-in-out 3s infinite; }
      .fade-up { animation: fadeUp .8s ease-out .5s both; }
      .cell    { transform-box: fill-box; transform-origin: center;
                 animation: pop .5s cubic-bezier(.34,1.4,.64,1) both; }
      .reveal-a { animation: reveal-a .95s steps(6, end) .35s both; }
      .reveal-b { animation: reveal-b .95s steps(20, end) .35s both; }
      .d0 { animation-delay: 0.28s; }
      .d1 { animation-delay: 0.33s; }
      .d2 { animation-delay: 0.37s; }
      .d3 { animation-delay: 0.42s; }
      .d4 { animation-delay: 0.46s; }
      .d5 { animation-delay: 0.51s; }
      .d6 { animation-delay: 0.55s; }
      .d7 { animation-delay: 0.59s; }
      .d8 { animation-delay: 0.64s; }
      .d9 { animation-delay: 0.69s; }
      .d10 { animation-delay: 0.73s; }
      .d11 { animation-delay: 0.78s; }
      .d12 { animation-delay: 0.82s; }
      .d13 { animation-delay: 0.86s; }
      .d14 { animation-delay: 0.91s; }
      .d15 { animation-delay: 0.95s; }

      @keyframes blink   { 0%,45% { opacity: 1; } 46%,100% { opacity: 0; } }
      @keyframes breathe { 0%,100% { opacity: .34; } 50% { opacity: .78; } }
      @keyframes ping    { 0%,100% { opacity: .45; transform: scale(.82); }
                           50% { opacity: 1; transform: scale(1); } }
      @keyframes pop     { from { opacity: 0; transform: scale(.55); }
                           to   { opacity: 1; transform: scale(1); } }
      @keyframes fadeUp  { from { opacity: 0; transform: translateY(7px); }
                           to   { opacity: 1; transform: translateY(0); } }
      @keyframes sheen   { 0%   { transform: translateX(-360px); }
                           22%  { transform: translateX(560px); }
                           100% { transform: translateX(560px); } }

      /* Respect reduced-motion, and guarantee a correct static render if the
         viewer never runs animations: every element falls back to its natural
         state (cells visible, prompt fully revealed, bar full). */
      @media (prefers-reduced-motion: reduce) {
        .cursor, .name, .led, .led-dot, .sheen, .fade-up,
        .cell, .reveal-a, .reveal-b, .fillbar {
          animation: none !important;
        }
      }
    </style>

      @keyframes reveal-a { from { width: 0; } to { width: 70.0px; } }
      @keyframes reveal-b { from { width: 0; } to { width: 210.0px; } }
      @keyframes fill     { from { width: 0; } to { width: 247px; } }

    <clipPath id="reveal-b">
      <rect class="reveal-b" x="96" y="82" width="210.0" height="30"/>
    </clipPath>
  </defs>

  <!-- backdrop -->
  <rect x="1" y="1" width="893" height="278" rx="14" fill="url(#bg)"/>
  <rect x="1" y="41" width="893" height="238" fill="url(#dots)"/>
  <ellipse cx="215" cy="150" rx="310" ry="145" fill="url(#halo-green)"/>
  <ellipse cx="700" cy="150" rx="340" ry="155" fill="url(#halo-blue)"/>

  <!-- window chrome -->
  <path d="M1 15 C1 7.3 7.3 1 15 1 L880 1 C887.7 1 894 7.3 894 15 L894 41 L1 41 Z" fill="url(#chrome)"/>
  <line x1="1" y1="41.5" x2="894" y2="41.5" stroke="#30363d"/>
  <circle cx="26" cy="21" r="6.3" fill="url(#led-red)"/>
  <circle cx="46" cy="21" r="6.3" fill="url(#led-amber)"/>
  <circle cx="66" cy="21" r="6.3" fill="url(#led-green)"/>
  <text x="447.5" y="25.5" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">hannwya@workspace:~/exit</text>
  <circle cx="806" cy="21" r="3" fill="#3fb950" class="led"/>
  <text x="818" y="25" class="mono micro" fill="#6e7681">SESSION</text>
  <text x="56" y="100" class="mono cmd blue">&#10148; ~</text>
  <g clip-path="url(#reveal-b)">
    <text x="96" y="100" class="mono cmd" fill="#f0f6fc">echo $STATUS &amp;&amp; exit<tspan class="cursor">&#9612;</tspan></text>
  </g>

  <!-- headline -->
  <text x="56" y="150" class="mono hero name" fill="#39d353"
        opacity="0.5" filter="url(#soft-glow)">Thanks for visiting!</text>
  <text x="56" y="150" class="mono hero" fill="url(#name-grad)">Thanks for visiting!</text>

  <line x1="56" y1="170" x2="452" y2="170" stroke="url(#rule)" stroke-width="1.5"/>

  <text x="56" y="194" class="mono body dim">Feel free to explore my repositories or</text>
  <text x="56" y="215" class="mono body dim">connect for collaborations.</text>

  <text x="56" y="243" class="mono body dim">[Process completed with code <tspan class="ok">0</tspan>. Session closed]<tspan class="cursor">&#9612;</tspan></text>

  <!-- session panel -->
  <rect x="560" y="66" width="295" height="188" rx="10" fill="#0d1117" fill-opacity="0.72" stroke="#21262d"/>
  <text x="584" y="90" class="mono micro" fill="#8b949e">SESSION</text>
  <text x="831" y="90" text-anchor="end" class="mono micro" fill="#3fb950">CLOSED</text>
  <line x1="584" y1="102" x2="831" y2="102" stroke="#21262d"/>

  <g class="mono body fade-up">
    <text x="584" y="130"><tspan class="key">connection     </tspan><tspan fill="#6e7681">:</tspan> <tspan class="ok">ok</tspan></text>
    <text x="584" y="153"><tspan class="key">repositories   </tspan><tspan fill="#6e7681">:</tspan> <tspan class="val">open</tspan></text>
    <text x="584" y="176"><tspan class="key">collaborations </tspan><tspan fill="#6e7681">:</tspan> <tspan class="val">welcome</tspan></text>
  </g>

  <line x1="584" y1="194" x2="831" y2="194" stroke="#21262d"/>

  <text x="584" y="215" class="mono micro" fill="#6e7681">PROGRESS</text>
  <text x="831" y="215" text-anchor="end" class="mono micro" fill="#3fb950">100%</text>
  <rect x="584" y="223" width="247" height="7" rx="3.5" fill="#21262d"/>
  <rect class="fillbar" x="584" y="223" width="247" height="7" rx="3.5" fill="url(#bar)"
        style="animation: fill 1.6s cubic-bezier(.25,.75,.3,1) .9s both"/>

  <!-- frame drawn last so the border is never clipped -->
  <rect x="0.75" y="0.75" width="893.5" height="278.5" rx="14" fill="none"
        stroke="url(#edge)" stroke-width="1.5"/>
</svg>
